{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>

        {% if edit %}

            Edit Product

        {% else %}

            Add Product

        {% endif %}

    </h2>

    <hr>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Product Name
            </label>

            <input
                type="text"
                class="form-control"
                name="name"
                value="{{ product.name if edit else '' }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea
                class="form-control"
                rows="4"
                name="description">{{ product.description if edit else '' }}</textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Price
            </label>

            <input
                type="number"
                step="0.01"
                class="form-control"
                name="price"
                value="{{ product.price if edit else '' }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Stock
            </label>

            <input
                type="number"
                class="form-control"
                name="stock"
                value="{{ product.stock if edit else '' }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Image URL
            </label>

            <input
                type="text"
                class="form-control"
                name="image_url"
                value="{{ product.image_url if edit else '' }}">

        </div>

        <button
            type="submit"
            class="btn btn-success">

            {% if edit %}
            Update Product
            {% else %}
            Save Product
            {% endif %}

        </button>

        <a
            href="{{ url_for('admin.products') }}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
