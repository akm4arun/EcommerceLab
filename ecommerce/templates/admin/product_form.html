{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>

        {% if edit %}

            Edit Product

        {% else %}

            Add Product

        {% endif %}

    </h2>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">

            <label class="form-label">
                Product Name
            </label>

            <input
                type="text"
                class="form-control"
                name="name"
                value="{{ product.name if product else '' }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea
                class="form-control"
                rows="4"
                name="description">{{ product.description if product else '' }}</textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Price
            </label>

            <input
                type="number"
                step="0.01"
                class="form-control"
                name="price"
                value="{{ product.price if product else '' }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Stock
            </label>

            <input
                type="number"
                class="form-control"
                name="stock"
                value="{{ product.stock if product else '' }}"
                required>

        </div>
        {% if edit and product.image_url %}

        <div class="mb-3">

            <label class="form-label">
                Current Image
            </label>

            <br>

            <img
                src="{{ url_for('static',
                                filename='uploads/' + product.image_url) }}"
                class="img-thumbnail"
                style="max-width:200px;">

        </div>

        {% endif %}
        <div class="mb-3">

            <label class="form-label">
                Product Image
            </label>

            <input
                type="file"
                class="form-control"
                name="image"
                accept="image/*">

        </div>

        <button
            type="submit"
            class="btn btn-success">

            {% if edit %}
            Update Product
            {% else %}
            Save Product
            {% endif %}

        </button>

        <a
            href="{{ url_for('admin.products') }}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
