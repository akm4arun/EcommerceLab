{% extends "base.html" %}

{% block title %}
Cart
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>Your Shopping Cart</h1>

{% if items %}

    <ul class="list-group">

    {% for item in items %}

        <li class="list-group-item d-flex justify-content-between">

            <span>

                {{ item.product.name }}

            </span>

            <span>

                Qty: {{ item.quantity }}

            </span>

        </li>

    {% endfor %}

    </ul>

{% else %}

<p>Your cart is currently empty.</p>

{% endif %}
</div>

{% endblock %}
