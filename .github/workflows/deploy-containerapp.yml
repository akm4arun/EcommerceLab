name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  ACR_NAME: ecommercelabacr
  IMAGE_NAME: ecommercelab
  CONTAINER_APP_NAME: ecommercelab-app
  RESOURCE_GROUP: rg-ecommercelab-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # GitHub Environment
    environment:
      name: production

    # Required for GitHub OIDC authentication
    permissions:
      contents: read
      id-token: write

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      
      - name: Verify Azure access
        shell: bash
        run: |
          echo "=== Account JSON ==="
          az account show -o json

          echo "=== Expected Subscription from Secret ==="
          echo "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          echo "=== Current Subscription ID ==="
          az account show --query id -o tsv

          echo "=== Current Tenant ID ==="
          az account show --query tenantId -o tsv

          echo "=== Service Principal ==="
          az ad sp show \
            --id "${{ secrets.AZURE_CLIENT_ID }}" \
            --query "{AppId:appId,ObjectId:id,DisplayName:displayName}" \
            -o json

          echo "=== Resource Group via ARM ==="
          az rest \
            --method GET \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourcegroups/rg-ecommercelab-dev?api-version=2021-04-01" \
            -o json

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install application dependencies
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Run database migrations
      - name: Run PostgreSQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: app.py
        run: |
          flask db upgrade

      # 6. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      # 8. Push image to ACR
      - name: Push Docker image
        run: |
          docker push \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      # 9. Capture the current production revision
      - name: Capture previous known-good revision
        id: previous_revision
        shell: bash
        run: |
          PREVIOUS_REVISION=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.trafficWeight == \`100\`].name | [0]" \
            -o tsv)

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "ERROR: Could not determine the current production revision."
            exit 1
          fi

          echo "Previous known-good revision: $PREVIOUS_REVISION"
          echo "revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"

      # 10. Deploy new image
      - name: Deploy new Container App revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      # 11. Capture the newly deployed revision
      - name: Capture new revision
        id: new_revision
        shell: bash
        run: |
          NEW_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            -o tsv)

          if [ -z "$NEW_REVISION" ]; then
            echo "ERROR: Could not determine the new revision."
            exit 1
          fi

          echo "New revision: $NEW_REVISION"
          echo "revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"

      # 12. Validate critical endpoints on the new revision
      - name: Validate critical endpoints
        id: critical_endpoint_test
        continue-on-error: true
        shell: bash
        run: |
          set -u

          NEW_REVISION="${{ steps.new_revision.outputs.revision }}"

          if [ -z "$NEW_REVISION" ]; then
            echo "ERROR: New revision is empty."
            exit 1
          fi

          NEW_FQDN=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$NEW_REVISION" \
            --query "properties.fqdn" \
            -o tsv)

          if [ -z "$NEW_FQDN" ]; then
            echo "ERROR: Could not determine the new revision FQDN."
            exit 1
          fi

          echo "=============================================="
          echo "Critical Endpoint Validation"
          echo "=============================================="
          echo "Revision : $NEW_REVISION"
          echo "FQDN     : https://$NEW_FQDN"
          echo "=============================================="

          FAILED=0

          validate_endpoint() {
            local ENDPOINT_PATH="$1"
            local URL="https://$NEW_FQDN$ENDPOINT_PATH"

            echo ""
            echo "Testing: $URL"

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              "$URL" 2>/tmp/curl_error)

            CURL_EXIT=$?

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "FAIL: $ENDPOINT_PATH"
              echo "curl exit code: $CURL_EXIT"

              if [ -s /tmp/curl_error ]; then
                echo "curl error:"
                cat /tmp/curl_error
              fi

              FAILED=1
              return
            fi

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then
              echo "PASS: $ENDPOINT_PATH"
            else
              echo "FAIL: $ENDPOINT_PATH returned HTTP $HTTP_CODE"
              FAILED=1
            fi
          }

          # Critical EcommerceLab endpoints
          validate_endpoint "/"
          validate_endpoint "/products/"
          validate_endpoint "/products/category/"
          validate_endpoint "/cart/"
          validate_endpoint "/orders/my-orders"

          echo ""
          echo "=============================================="
          echo "Validation Summary"
          echo "=============================================="

          if [ "$FAILED" -eq 0 ]; then
            echo "ALL CRITICAL ENDPOINTS PASSED."
            exit 0
          else
            echo "CRITICAL ENDPOINT VALIDATION FAILED."
            exit 1
          fi

      # 13. Rollback on critical endpoint validation failure
      - name: Rollback to previous known-good revision
        if: steps.critical_endpoint_test.outcome == 'failure'
        shell: bash
        run: |
          set -e

          PREVIOUS_REVISION="${{ steps.previous_revision.outputs.revision }}"

          echo "Critical endpoint validation failed."
          echo "Rolling back to: $PREVIOUS_REVISION"

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "ERROR: Previous known-good revision is empty."
            exit 1
          fi

          az containerapp ingress traffic set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$PREVIOUS_REVISION=100"

          echo "Rollback command completed."

          echo "Verifying traffic assignment..."

          CURRENT_TRAFFIC=$(az containerapp ingress traffic show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?revisionName=='$PREVIOUS_REVISION'].weight | [0]" \
            -o tsv)

          if [ "$CURRENT_TRAFFIC" != "100" ]; then
            echo "ERROR: Rollback verification failed."
            echo "Expected traffic: 100%"
            echo "Actual traffic: ${CURRENT_TRAFFIC:-unknown}%"
            exit 1
          fi

          echo "Rollback verified successfully."
          echo "Traffic is 100% on $PREVIOUS_REVISION."

      # 14. Promote only if critical endpoint validation passed
      - name: Promote new revision
        if: steps.critical_endpoint_test.outcome == 'success'
        shell: bash
        run: |
          NEW_REVISION="${{ steps.new_revision.outputs.revision }}"

          echo "Promoting revision: $NEW_REVISION"

          az containerapp ingress traffic set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$NEW_REVISION=100"

          echo "Revision promoted successfully."

      # 15. Show evidence
      - name: Show deployment revisions
        if: always()
        shell: bash
        run: |
          echo "Previous known-good revision:"
          echo "${{ steps.previous_revision.outputs.revision }}"

          echo "New revision:"
          echo "${{ steps.new_revision.outputs.revision }}"

          echo "Critical endpoint validation result:"
          echo "${{ steps.critical_endpoint_test.outcome }}"

          echo "All revisions:"

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,active:properties.active,traffic:properties.trafficWeight,state:properties.provisioningState}" \
            -o table

      # 16. Fail workflow if critical endpoint validation failed
      - name: Mark deployment as failed
        if: steps.critical_endpoint_test.outcome == 'failure'
        shell: bash
        run: |
          echo "Deployment failed critical endpoint validation."
          echo "Rollback was attempted."
          exit 1
