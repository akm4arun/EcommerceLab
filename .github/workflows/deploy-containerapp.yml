name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  ACR_NAME: ecommercelabacr
  IMAGE_NAME: ecommercelab
  CONTAINER_APP_NAME: ecommercelab-app
  RESOURCE_GROUP: rg-ecommercelab-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # GitHub Environment
    environment:
      name: production

    # Required for GitHub OIDC authentication
    permissions:
      contents: read
      id-token: write

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show --output table

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install application dependencies
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Run database migrations
      - name: Run PostgreSQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: app.py
        run: |
          flask db upgrade

      # 6. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      # 8. Push image to ACR
      - name: Push Docker image
        run: |
          docker push \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      # 9. Deploy image to Azure Container App
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}