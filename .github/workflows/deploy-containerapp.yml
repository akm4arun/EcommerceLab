name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  ACR_NAME: ecommercelabacr
  IMAGE_NAME: ecommercelab
  CONTAINER_APP_NAME: ecommercelab-app
  RESOURCE_GROUP: rg-ecommercelab-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # GitHub Environment
    environment:
      name: production

    # Required for GitHub OIDC authentication
    permissions:
      contents: read
      id-token: write

    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout source code
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Authenticate to Azure using OIDC
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # 2A. Verify Azure access
      # -----------------------------------------------------------------------
      - name: Verify Azure access
        shell: bash
        run: |
          echo "=== Account JSON ==="
          az account show -o json

          echo "=== Expected Subscription from Secret ==="
          echo "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          echo "=== Current Subscription ID ==="
          az account show --query id -o tsv

          echo "=== Current Tenant ID ==="
          az account show --query tenantId -o tsv

          echo "=== Service Principal ==="
          az ad sp show \
            --id "${{ secrets.AZURE_CLIENT_ID }}" \
            --query "{AppId:appId,ObjectId:id,DisplayName:displayName}" \
            -o json

          echo "=== Resource Group via ARM ==="
          az rest \
            --method GET \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourcegroups/${RESOURCE_GROUP}?api-version=2021-04-01" \
            -o json

      # -----------------------------------------------------------------------
      # 3. Setup Python
      # -----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -----------------------------------------------------------------------
      # 4. Install application dependencies
      # -----------------------------------------------------------------------
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 5. Run database migrations
      # -----------------------------------------------------------------------
      - name: Run PostgreSQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLASK_APP: app.py
        run: |
          flask db upgrade

      # -----------------------------------------------------------------------
      # 6. Login to Azure Container Registry
      # -----------------------------------------------------------------------
      - name: Login to ACR
        run: |
          az acr login --name "$ACR_NAME"

      # -----------------------------------------------------------------------
      # 7. Build Docker image
      # -----------------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}" .

      # -----------------------------------------------------------------------
      # 8. Push Docker image to ACR
      # -----------------------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      # -----------------------------------------------------------------------
      # 9. Capture current production revision and production App FQDN
      #
      # The revision with 100% traffic is the previous production revision.
      # The App FQDN is used to validate the actual production ingress path.
      # -----------------------------------------------------------------------
      - name: Capture previous production revision
        id: previous_revision
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_REVISION=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.trafficWeight == \`100\`].name | [0]" \
            -o tsv)

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "ERROR: Could not determine the current production revision."
            exit 1
          fi

          PRODUCTION_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          if [ -z "$PRODUCTION_FQDN" ]; then
            echo "ERROR: Could not determine the production App FQDN."
            exit 1
          fi

          echo "Previous production revision: $PREVIOUS_REVISION"
          echo "Production App FQDN: $PRODUCTION_FQDN"

          echo "revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
          echo "fqdn=$PRODUCTION_FQDN" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 10. Deploy new image
      # -----------------------------------------------------------------------
      - name: Deploy new Container App revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      # -----------------------------------------------------------------------
      # 11. Capture newly deployed revision and FQDN
      # -----------------------------------------------------------------------
      - name: Capture new revision
        id: new_revision
        shell: bash
        run: |
          NEW_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            -o tsv)

          if [ -z "$NEW_REVISION" ]; then
            echo "ERROR: Could not determine the new revision."
            exit 1
          fi

          NEW_FQDN=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$NEW_REVISION" \
            --query "properties.fqdn" \
            -o tsv)

          if [ -z "$NEW_FQDN" ]; then
            echo "ERROR: Could not determine the new revision FQDN."
            exit 1
          fi

          echo "New revision: $NEW_REVISION"
          echo "Revision FQDN: $NEW_FQDN"

          echo "revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"
          echo "fqdn=$NEW_FQDN" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 12. Run complete functional validation against the NEW revision
      # -----------------------------------------------------------------------
      - name: Validate new revision
        id: revision_validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          NEW_REVISION="${{ steps.new_revision.outputs.revision }}"
          NEW_FQDN="${{ steps.new_revision.outputs.fqdn }}"

          if [ -z "$NEW_REVISION" ] || [ -z "$NEW_FQDN" ]; then
            echo "ERROR: New revision or FQDN is empty."
            exit 1
          fi

          echo "=============================================="
          echo "Full Functional Validation"
          echo "=============================================="
          echo "Revision : $NEW_REVISION"
          echo "FQDN     : https://$NEW_FQDN"
          echo "=============================================="

          chmod +x ecommerce/scripts/validate_revision.sh

          VALIDATION_OUTPUT=$(mktemp)

          ecommerce/scripts/validate_revision.sh "https://$NEW_FQDN" \
            2>&1 | tee "$VALIDATION_OUTPUT"

          VALIDATION_RC=${PIPESTATUS[0]}

          FAILED_CHECKS=$(grep '^ - ' "$VALIDATION_OUTPUT" \
            | sed 's/^ - //' \
            | paste -sd ',' - || true)

          echo "failed_checks=$FAILED_CHECKS" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Validation exit code: $VALIDATION_RC"
          echo "Failed checks: ${FAILED_CHECKS:-none}"

          rm -f "$VALIDATION_OUTPUT"

          if [ "$VALIDATION_RC" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "New revision passed full functional validation."
            exit 0
          fi

          echo "result=failure" >> "$GITHUB_OUTPUT"
          echo "New revision FAILED full functional validation."

          exit 1

      # -----------------------------------------------------------------------
      # 13. Find healthy recovery revision
      #
      # Recovery priority:
      #   1. Previous production revision - validate this FIRST.
      #   2. If previous production revision fails, test other active
      #      revisions as fallback candidates.
      #
      # IMPORTANT:
      # Azure health state alone is NOT considered sufficient.
      # Every recovery candidate is tested with validate_revision.sh.
      # -----------------------------------------------------------------------
      - name: Find healthy recovery revision
        id: recovery_revision
        if: steps.revision_validation.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail

          NEW_REVISION="${{ steps.new_revision.outputs.revision }}"
          PREVIOUS_REVISION="${{ steps.previous_revision.outputs.revision }}"

          echo "=============================================="
          echo "Searching for healthy recovery revision"
          echo "=============================================="
          echo "Failed candidate       : $NEW_REVISION"
          echo "Previous production    : $PREVIOUS_REVISION"

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "ERROR: Previous production revision is empty."
            exit 1
          fi

          chmod +x ecommerce/scripts/validate_revision.sh

          echo ""
          echo "Available revisions:"

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,state:properties.runningState,health:properties.healthState,traffic:properties.trafficWeight,active:properties.active,created:properties.createdTime}" \
            -o table

          # -------------------------------------------------------------------
          # First priority: previous production revision.
          #
          # This is the revision that was serving 100% production traffic
          # immediately before the failed deployment.
          # -------------------------------------------------------------------
          echo ""
          echo "=============================================="
          echo "Priority recovery candidate"
          echo "=============================================="
          echo "Testing previous production revision: $PREVIOUS_REVISION"

          PRODUCTION_FQDN="${{ steps.previous_revision.outputs.fqdn }}"

          if [ -n "$PRODUCTION_FQDN" ]; then
            echo "Production App FQDN: https://$PRODUCTION_FQDN"

            if ecommerce/scripts/validate_revision.sh "https://$PRODUCTION_FQDN"; then
              echo ""
              echo "PASS: Previous production revision passed full functional validation."
              echo "Using $PREVIOUS_REVISION as the recovery revision."

              echo "revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
              echo "fqdn=$PRODUCTION_FQDN" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo ""
            echo "FAIL: Previous production revision failed validation."
          else
            echo "WARNING: Could not determine FQDN for $PREVIOUS_REVISION."
          fi

          # -------------------------------------------------------------------
          # Fallback: test other active revisions.
          #
          # The previous production revision has already been tested above,
          # so it is excluded here.
          # -------------------------------------------------------------------
          echo ""
          echo "=============================================="
          echo "Building fallback recovery candidate list"
          echo "=============================================="

          FALLBACK_CANDIDATES=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name != '$NEW_REVISION' && name != '$PREVIOUS_REVISION' && properties.active == \`true\`] | sort_by(@, &properties.createdTime) | reverse(@) | [].name" \
            -o tsv)

          if [ -z "$FALLBACK_CANDIDATES" ]; then
            echo "ERROR: Previous production revision failed and no fallback candidates were found."
            exit 1
          fi

          FOUND_REVISION=""
          FOUND_FQDN=""

          while IFS= read -r CANDIDATE; do
            [ -z "$CANDIDATE" ] && continue

            echo ""
            echo "=============================================="
            echo "Testing fallback recovery candidate: $CANDIDATE"
            echo "=============================================="

            CANDIDATE_FQDN=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$CANDIDATE" \
              --query "properties.fqdn" \
              -o tsv)

            if [ -z "$CANDIDATE_FQDN" ]; then
              echo "WARNING: Could not determine FQDN for $CANDIDATE."
              continue
            fi

            echo "FQDN: https://$CANDIDATE_FQDN"

            if ecommerce/scripts/validate_revision.sh "https://$CANDIDATE_FQDN"; then
              echo ""
              echo "PASS: Fallback recovery candidate $CANDIDATE passed full functional validation."

              FOUND_REVISION="$CANDIDATE"
              FOUND_FQDN="$CANDIDATE_FQDN"

              break
            fi

            echo ""
            echo "FAIL: Fallback recovery candidate $CANDIDATE failed validation."

          done <<< "$FALLBACK_CANDIDATES"

          if [ -z "$FOUND_REVISION" ]; then
            echo ""
            echo "ERROR: No healthy recovery revision could be found."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "Healthy Recovery Revision Found"
          echo "=============================================="
          echo "Recovery revision: $FOUND_REVISION"
          echo "Recovery FQDN     : $FOUND_FQDN"
          echo "Recovery source   : fallback candidate"

          echo "revision=$FOUND_REVISION" >> "$GITHUB_OUTPUT"
          echo "fqdn=$FOUND_FQDN" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 14. Roll back to the FIRST revision that passed full validation
      # -----------------------------------------------------------------------
      - name: Roll back to healthy recovery revision
        id: rollback
        if: steps.revision_validation.outcome == 'failure' && steps.recovery_revision.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY_REVISION="${{ steps.recovery_revision.outputs.revision }}"

          if [ -z "$RECOVERY_REVISION" ]; then
            echo "ERROR: Recovery revision is empty."
            exit 1
          fi

          echo "=============================================="
          echo "Rolling Back"
          echo "=============================================="
          echo "Recovery revision: $RECOVERY_REVISION"

          az containerapp ingress traffic set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$RECOVERY_REVISION=100"

          echo ""
          echo "Verifying traffic assignment..."

          CURRENT_TRAFFIC=$(az containerapp ingress traffic show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?revisionName=='$RECOVERY_REVISION'].weight | [0]" \
            -o tsv)

          if [ "$CURRENT_TRAFFIC" != "100" ]; then
            echo "ERROR: Rollback verification failed."
            echo "Expected traffic: 100%"
            echo "Actual traffic: ${CURRENT_TRAFFIC:-unknown}%"
            exit 1
          fi

          echo ""
          echo "Rollback verified successfully."
          echo "Traffic is 100% on $RECOVERY_REVISION."

      # -----------------------------------------------------------------------
      # 15. Create ICM after recovery decision
      #
      # This is deliberately AFTER recovery selection so the ICM contains
      # the actual healthy recovery revision.
      # -----------------------------------------------------------------------
      - name: Create ICM for validation failure
        id: create_icm
        if: steps.revision_validation.outcome == 'failure'
        env:
          ICM_API_TOKEN: ${{ secrets.ICM_API_TOKEN }}
          ICM_API_URL: https://${{ steps.new_revision.outputs.fqdn }}/admin/icm/api/incidents
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Creating ICM"
          echo "=============================================="

          FAILED_CHECKS="${{ steps.revision_validation.outputs.failed_checks }}"
          NEW_REVISION="${{ steps.new_revision.outputs.revision }}"
          PREVIOUS_REVISION="${{ steps.previous_revision.outputs.revision }}"
          RECOVERY_REVISION="${{ steps.recovery_revision.outputs.revision }}"

          if [ -z "$RECOVERY_REVISION" ]; then
            RECOVERY_REVISION="NONE_FOUND"
          fi

          echo "Candidate revision : $NEW_REVISION"
          echo "Previous revision  : $PREVIOUS_REVISION"
          echo "Recovery revision  : $RECOVERY_REVISION"
          echo "Failed checks      : ${FAILED_CHECKS:-unknown}"

          # Build JSON safely using Python and environment variables.
          # This avoids shell/Python quoting problems when values contain
          # special characters.
          export NEW_REVISION
          export PREVIOUS_REVISION
          export RECOVERY_REVISION
          export FAILED_CHECKS
          export CONTAINER_APP_NAME
          export GITHUB_WORKFLOW
          export GITHUB_RUN_ID
          export GITHUB_SHA

          PAYLOAD=$(python - <<'PY'
          import json
          import os

          new_revision = os.environ["NEW_REVISION"]
          previous_revision = os.environ["PREVIOUS_REVISION"]
          recovery_revision = os.environ["RECOVERY_REVISION"]
          failed_checks = os.environ["FAILED_CHECKS"]

          payload = {
              "title": f"Deployment validation failed for revision {new_revision}",
              "severity": "High",
              "status": "Open",
              "application": os.environ["CONTAINER_APP_NAME"],
              "environment": "Production",
              "pipeline_name": os.environ["GITHUB_WORKFLOW"],
              "pipeline_run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "candidate_revision": new_revision,
              "previous_revision": previous_revision,
              "failed_endpoints": failed_checks,
              "failure_summary": (
                  "Full functional validation failed after deployment."
              ),
              "rca_summary": (
                  "Deployment validation failed for the candidate revision. "
                  "One or more functional application checks failed."
              ),
              "recommended_action": (
                  f"Traffic was automatically routed to recovery revision "
                  f"{recovery_revision} after that revision passed the complete "
                  f"functional validation suite."
              ),
          }

          print(json.dumps(payload))
          PY
                    )

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${ICM_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "${ICM_API_URL}")

          echo "ICM API response:"
          echo "$RESPONSE"

          ICM_NUMBER=$(echo "$RESPONSE" | python -c \
          "import sys,json; print(json.load(sys.stdin).get('incident_number','UNKNOWN'))")

          ICM_ID=$(echo "$RESPONSE" | python -c \
            "import sys,json; print(json.load(sys.stdin).get('incident_id','UNKNOWN'))")

          if [ -z "$ICM_ID" ] || [ "$ICM_ID" = "UNKNOWN" ]; then
            echo "ERROR: ICM ID was not returned by the ICM API."
            exit 1
          fi

          if [ -z "$ICM_NUMBER" ] || [ "$ICM_NUMBER" = "UNKNOWN" ]; then
            echo "ERROR: ICM number was not returned by the ICM API."
            exit 1
          fi

          echo "icm_id=${ICM_ID}" >> "$GITHUB_OUTPUT"
          echo "icm_number=${ICM_NUMBER}" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "ICM CREATED: $ICM_NUMBER"
          echo "ICM ID     : $ICM_ID"
          echo "=============================================="

          echo "=============================================="
          echo "Verifying ICM GET API"
          echo "=============================================="

          GET_RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request GET \
            --header "Authorization: Bearer ${ICM_API_TOKEN}" \
            --header "Accept: application/json" \
            "${ICM_API_URL}/${ICM_ID}")

          echo "ICM GET API response:"
          echo "$GET_RESPONSE"

          echo "ICM GET API verification succeeded."

      # -----------------------------------------------------------------------
      # 16. Promote NEW revision only when complete functional validation
      #     passes.
      # -----------------------------------------------------------------------
      - name: Promote new revision
        if: steps.revision_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          NEW_REVISION="${{ steps.new_revision.outputs.revision }}"

          echo "=============================================="
          echo "Promoting New Revision"
          echo "=============================================="
          echo "Revision: $NEW_REVISION"

          az containerapp ingress traffic set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$NEW_REVISION=100"

          echo ""
          echo "Verifying traffic assignment..."

          CURRENT_TRAFFIC=$(az containerapp ingress traffic show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?revisionName=='$NEW_REVISION'].weight | [0]" \
            -o tsv)

          if [ "$CURRENT_TRAFFIC" != "100" ]; then
            echo "ERROR: New revision promotion verification failed."
            echo "Expected traffic: 100%"
            echo "Actual traffic: ${CURRENT_TRAFFIC:-unknown}%"
            exit 1
          fi

          echo "New revision promoted successfully."
          echo "Traffic is 100% on $NEW_REVISION."

      # -----------------------------------------------------------------------
      # 17. Show deployment evidence
      # -----------------------------------------------------------------------
      - name: Show deployment revisions
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "DEPLOYMENT EVIDENCE"
          echo "=============================================="

          echo ""
          echo "Previous production revision:"
          echo "${{ steps.previous_revision.outputs.revision }}"

          echo ""
          echo "New revision:"
          echo "${{ steps.new_revision.outputs.revision }}"

          echo ""
          echo "New revision functional validation result:"
          echo "${{ steps.revision_validation.outcome }}"

          echo ""
          echo "Failed functional checks:"
          echo "${{ steps.revision_validation.outputs.failed_checks }}"

          echo ""
          echo "Selected recovery revision:"
          echo "${{ steps.recovery_revision.outputs.revision }}"

          echo ""
          echo "Rollback result:"
          echo "${{ steps.rollback.outcome }}"

          echo ""
          echo "All revisions:"
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,active:properties.active,traffic:properties.trafficWeight,state:properties.runningState,health:properties.healthState,created:properties.createdTime}" \
            -o table

      # -----------------------------------------------------------------------
      # 18. Fail workflow if the NEW revision failed validation
      #
      # This happens AFTER rollback/ICM processing so the operational recovery
      # actions are completed before GitHub marks the deployment failed.
      # -----------------------------------------------------------------------
      - name: Mark deployment as failed
        if: steps.revision_validation.outcome == 'failure'
        shell: bash
        run: |
          echo "=============================================="
          echo "DEPLOYMENT FAILED"
          echo "=============================================="
          echo "The newly deployed revision failed full functional validation."

          if [ "${{ steps.recovery_revision.outcome }}" = "success" ]; then
            echo "A healthy recovery revision was found."
            echo "Recovery revision: ${{ steps.recovery_revision.outputs.revision }}"
            echo "Traffic was routed to the healthy recovery revision."
          else
            echo "WARNING: No healthy recovery revision was found."
          fi

          echo ""
          echo "Failed checks:"
          echo "${{ steps.revision_validation.outputs.failed_checks }}"

          exit 1
