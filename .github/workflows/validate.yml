# // Run validation utility
# Fail the pipeline if validation fails

name: Validate EcommerceLab

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Flask app
        run: echo "FLASK_APP=app.py" >> $GITHUB_ENV

      - name: Create instance folder
        run: mkdir -p instance

      - name: Create database schema
        run: |
            python -c "from ecommerce import create_app; from ecommerce.extensions import db; app=create_app(); app.app_context().push(); db.create_all(); print('Database created')"

    #   - name: Run migrations
    #     run: flask db upgrade
    

      - name: Run seed automation
        run: python -m ecommerce.scripts.seed_all

      - name: Run database validation
        run: python -m ecommerce.scripts.validate_db

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform-lab

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate
